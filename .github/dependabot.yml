# .github/dependabot.yml (P3a, DW-80)
# Greptile no longer reviews automatically (autoReview [], 2026-10-26), but each PR still runs CI
# and the router. So: monthly, one grouped PR per ecosystem, at most 1 open PR each, and no
# automatic rebase (a rebase is a push, and a push reruns CI).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown: { default-days: 7 }
    groups: { actions: { patterns: ["*"] } }
  # One npm entry for all three folders: one shared open-PR limit, so at most one npm
  # VERSION-update PR is open at a time. (group-by: dependency-name would only merge the same
  # package across folders, not all updates, so it is not used.)
  # npm and uv version updates: minor and patch only (Dave, 2026-10-26). Grouped majors broke
  # both PRs (#160: TypeScript 7 breaks typescript-eslint; #161: mcp 2 renamed an import). A
  # major version update is a deliberate task, done by hand, one package at a time.
  # Security updates are separate: they have their own PR limit, and this ignore rule does
  # not suppress them (GitHub docs, dependabot.yml configuration options).
  - package-ecosystem: npm
    directories: ["/.claude/hooks", "/apps/agentic-os", "/opc/scripts/dashboard/frontend"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown: { default-days: 7 }
    groups: { npm-all: { patterns: ["*"] } }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: "/opc"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown: { default-days: 7 }
    groups: { opc-uv: { patterns: ["*"] } }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
