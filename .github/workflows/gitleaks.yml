# .github/workflows/gitleaks.yml
name: gitleaks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"          # latest stable v8 as of 2026-10-25 (published 2026-03-21); sha256 matches release checksums.txt
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history (L1b)
      - name: Install gitleaks (official release binary, pinned + checksum)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks full-history scan
        run: gitleaks git --redact --verbose --exit-code 1 .
        # If the pinned version predates the `git` subcommand: gitleaks detect --source . --redact -v --exit-code 1
        # .gitleaksignore at repo root is picked up automatically.
