# .github/workflows/review-router.yml
# P3c (DW-80): label a ready PR with its risk class and the PR bots that must review it.
# Spec: artifacts/ccv3-review-economy/router-spec.md. Config: review-router.config.json.
# The router spends no LLM credits and never removes a label. A draft PR is skipped at the job level.
# pull_request_target: the workflow, script and config come from the BASE branch (main), so a PR
# cannot lower its own risk class by editing the router. Checkout uses the default ref (the base
# commit). NEVER check out the PR head here: this job holds a write token. The router reads the
# PR's changed files through the GitHub API only and runs no PR code.
# Actions are pinned by commit SHA (same pins as ccv3-checks.yml). No third-party action tags.
name: review-router
on:
  pull_request_target:
    # edited counts only when the base branch changed (a stacked PR retargeted to main): see the job condition.
    # labeled/unlabeled: a person changing a risk:* or review:* label gets one ledger row; the router writes nothing.
    # The router's own label writes use GITHUB_TOKEN, which starts no workflow run.
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]
    branches: [main]
  # CodeRabbit posts its rate-limit notice as a PR comment after routing. Re-route then so the router
  # comment shows the note (the job filter below keeps only that bot and that notice). Runs from main.
  issue_comment:
    types: [created, edited]
  # Manual re-run for one PR (for example after a failed run). Runs as a push event would.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to route
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  route:
    # contains() is case-insensitive.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'coderabbitai[bot]' && github.event.comment.user.type == 'Bot' &&
        (contains(github.event.comment.body, 'rate limit') || contains(github.event.comment.body, 'limit reached'))) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false &&
        (github.event.action != 'edited' || github.event.changes.base != null) &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          (github.event.sender.type == 'User' &&
            (startsWith(github.event.label.name, 'risk:') || startsWith(github.event.label.name, 'review:')))))
    # Job-level, so a skipped run (a bot editing the PR body fires `edited`) never joins the group and
    # never cancels a queued push run. Two quick pushes still run one after another.
    # Each label run (it writes only a ledger row) gets its own group, so a label change never replaces a
    # pending push run, and two quick label changes never replace each other (one ledger row each).
    concurrency:
      group: review-router-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('label-{0}', github.run_id) || 'route' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Route the PR (labels, one comment, one ledger line)
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github/review-router.mjs
      # A manual re-run or a CodeRabbit limit notice routes like a push (a draft PR is still skipped by the script).
      - name: Route the PR (manual re-run or CodeRabbit limit notice)
        if: github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.issue.number }}
        run: node scripts/github/review-router.mjs "$PR" --event synchronize
      # The script appends one JSON line per run to $RUNNER_TEMP/review-ledger.jsonl (spec 7). Keep it with the run.
      - name: Upload the ledger line
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-ledger-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-ledger.jsonl
          if-no-files-found: ignore
          retention-days: 90
