# .github/workflows/ccv3-checks.yml
# P3a (DW-80): repo ratchets + Trivy + Semgrep on every PR to main and every push to main.
# Scanner tools are pinned binaries/images with checksums or digests. No third-party action tags:
# the trivy-action tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23).
# Scanner findings are a ratchet (scripts/ratchets/scan-ratchet.mjs): only NEW high-severity
# findings in files this change touched fail; new findings in untouched files print as DRIFT.
name: ccv3-checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ccv3-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # this job never pushes; keep the git token off disk (zizmor artipacked)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Always-loaded context budget
        run: node scripts/rules/context-budget-guard.mjs --repo
      - name: Skill audit (G01-G33 ratchet)
        run: node scripts/skills/audit-skills.mjs
      - name: Agent model drift
        run: node scripts/check-agent-model-drift.mjs .
      - name: Agent body check
        run: node scripts/agents/check-agent-body.mjs
      - name: Hook manifest (rendered template)
        run: node scripts/hook-manifest-check.mjs --repo
      - name: Hook coverage ratchet (every registered hook has a test)
        run: node scripts/hooks/hook-coverage-ratchet.mjs
      - name: hook-coverage-ratchet unit tests
        run: node --test scripts/hooks/hook-coverage-ratchet.test.mjs
      - name: scan-ratchet unit tests
        run: node --test scripts/ratchets/scan-ratchet.test.mjs
      - name: Reviewer skip-list in sync (REVIEW.md vs Greptile + CodeRabbit)
        run: node scripts/ratchets/review-skip-sync.mjs
      - name: review-skip-sync unit tests
        run: node --test scripts/ratchets/review-skip-sync.test.mjs
      - name: review-router unit tests
        run: node --test scripts/github/review-router.test.mjs
      - name: tdd skill tidy unit tests
        run: node --test scripts/skills/tdd-tidy.test.mjs
      - name: review-status unit tests
        timeout-minutes: 5
        run: node --test scripts/github/review-status.test.mjs
      - name: pr-checkpoint unit tests
        timeout-minutes: 5
        run: node --test scripts/github/pr-checkpoint.test.mjs
      - name: pre-pr unit tests
        timeout-minutes: 5
        run: node --test scripts/github/pre-pr-shard-1.test.mjs scripts/github/pre-pr-shard-2.test.mjs scripts/github/pre-pr-shard-3.test.mjs scripts/github/pre-pr-shard-4.test.mjs scripts/github/pre-pr-shards.test.mjs scripts/github/pre-pr-partial-run.test.mjs scripts/github/pre-pr-run-lock.test.mjs scripts/github/pre-pr-signal.test.mjs
      - name: land-recheck unit tests
        timeout-minutes: 5
        run: node --test scripts/github/land-recheck.test.mjs
      - name: cr-paid unit tests
        timeout-minutes: 5
        run: node --test scripts/github/cr-paid.test.mjs scripts/github/cr-paid-post.test.mjs scripts/github/cr-paid-unledgered.test.mjs scripts/github/cr-paid-merge-head.test.mjs scripts/github/paid-guard-confirm.test.mjs scripts/github/paid-guard-decisions.test.mjs scripts/github/ship-ask-paid-price.test.mjs
      - name: cr-fix unit tests
        timeout-minutes: 5
        run: node --test scripts/github/cr-fix.test.mjs
      - name: pr-spend unit tests
        timeout-minutes: 5
        run: node --test scripts/github/pr-spend.test.mjs
      - name: open-prs unit tests
        timeout-minutes: 5
        run: node --test scripts/github/open-prs.test.mjs
      - name: shared lib unit tests (file lock)
        timeout-minutes: 5
        run: node --test scripts/github/lib/file-lock.test.mjs
      # Review engine P1 (units A, B, C). Each test builds its own temp git repos and injects the agent, gh and the clock: no network,
      # no cursor-agent, no Windows-only binary (the tldr.exe test injects its platform). Glob patterns are in single quotes, so Node 22
      # expands them; bash reads ** as * and would drop the top-level files.
      - name: local review engine unit tests
        timeout-minutes: 10
        run: node --test scripts/github/local-review.test.mjs scripts/github/review-filter.test.mjs 'scripts/github/local-review/**/*.test.mjs'
      - name: review-router band tests (engine trust-boundary files are CRITICAL)
        timeout-minutes: 5
        run: node --test scripts/github/review-router-band.test.mjs
      - name: review-router config keys and flip rule tests
        timeout-minutes: 5
        run: node --test scripts/github/review-router-config-keys.test.mjs scripts/github/review-router-flip.test.mjs
      - name: stricter config tests (the stricter of main and the branch wins)
        timeout-minutes: 5
        run: node --test scripts/github/config-stricter.test.mjs
      - name: cap override tests (the one-run CLI cap override and its tap)
        timeout-minutes: 5
        run: node --test scripts/github/cap-override.test.mjs
      - name: hook payload gate tests (fixture planner, run, pre-pr surface rows)
        timeout-minutes: 5
        run: node --test scripts/github/hook-payload.test.mjs scripts/github/pre-pr-hook-payload.test.mjs
      - name: slot-queue unit tests
        timeout-minutes: 5
        run: node --test scripts/github/slot-queue.test.mjs scripts/github/slot-queue-model.test.mjs scripts/github/slot-queue-mod-sync.test.mjs scripts/github/slot-queue-paid-cap.test.mjs
      - name: harness-doctor unit tests
        timeout-minutes: 5
        run: node --test scripts/harness-doctor.test.mjs
      # Worktree dependency fallback (PR1): one resolver for pg and friends, the pre-pr env step, and a ratchet against new copies.
      - name: shared lib, dependency resolver and pre-pr env step unit tests
        timeout-minutes: 5
        run: node --test 'scripts/lib/*.test.mjs' scripts/github/lib/env-step.test.mjs
      # Worktree dependency fallback (PR2): the shared store link script. Each test builds a fake primary and nested worktrees under the temp folder.
      - name: shared store link unit tests
        timeout-minutes: 5
        run: node --test scripts/worktree/shared-deps.test.mjs
      # Status band goal: the plugin copy of the lane-note goal extractor must give the same result as the repo extractor.
      - name: band goal extractor drift test
        timeout-minutes: 5
        run: node --test scripts/mods/goal-extractor-drift.test.mjs
      - name: no new pg lookup outside the resolver (ratchet)
        run: node scripts/ratchets/no-pg-lookup.mjs
      - name: no-pg-lookup unit tests
        timeout-minutes: 5
        run: node --test scripts/ratchets/no-pg-lookup.test.mjs
      # Every tracked test file is in a gate or on the named skip list (scripts/github/gate-coverage-skip.json). The check reads git ls-files, pre-pr.mjs and the workflows.
      - name: gate coverage (every test file is in a gate or on the skip list)
        timeout-minutes: 5
        run: node scripts/github/gate-coverage.mjs
      - name: gate-coverage unit tests
        timeout-minutes: 5
        run: node --test scripts/github/gate-coverage.test.mjs
      # Pre-PR checks built from CodeRabbit Majors (C1 scrubber grid, C2 Semgrep pack, C5 state tables).
      # semgrep-ccv3 unit tests also read the Semgrep digest above (SG2): they fail when the two digests differ.
      - name: semgrep-ccv3 wrapper unit tests
        timeout-minutes: 5
        run: node --test scripts/ratchets/semgrep-ccv3.test.mjs
      - name: checks unit tests (state-table helper, prove-check harness, test-map selector)
        timeout-minutes: 5
        run: node --test scripts/checks/state-table.test.mjs scripts/checks/prove-check.test.mjs scripts/checks/test-map.test.mjs scripts/checks/fixture-gap.test.mjs scripts/checks/line-ends-lf.test.mjs
      - name: router checkpoint state x event table (C5 T2)
        timeout-minutes: 5
        run: node --test scripts/github/review-router-checkpoint-table.test.mjs
      - name: self-approve gate (router none gate, land-none-check)
        timeout-minutes: 5
        run: node --test scripts/github/pr-checkpoint-no-review.test.mjs scripts/github/land-none-check.test.mjs scripts/github/land-none-base-code.test.mjs scripts/github/force-high-followups.test.mjs
      - name: agentic-os CI job is defined (lint, typecheck, build)
        timeout-minutes: 5
        run: node --test scripts/ratchets/ccv3-checks-agentic-os.test.mjs
      - name: every checkout sets persist-credentials false (zizmor artipacked)
        timeout-minutes: 5
        run: node --test scripts/ratchets/ccv3-checks-persist-credentials.test.mjs
      - name: Install root dev dependencies (Playwright test runner, no scripts, no browser download)
        timeout-minutes: 5
        run: npm ci --ignore-scripts
      - name: Path scrubber grid (C1 part A, pure Node, no server, no database, no browser)
        timeout-minutes: 5
        run: npx playwright test --config apps/agentic-os/playwright.pure.config.ts
      # The review eval scorer and its fixtures (about 5 s). The pattern is in single quotes, so Node expands it.
      - name: review eval unit tests
        timeout-minutes: 5
        run: node --test 'scripts/eval/review-eval/*.test.mjs' 'scripts/eval/review-eval/rubrics/*.test.mjs'

  # The hooks are TypeScript that ships as dist/*.mjs. This job type-checks, builds and tests them. Before it no workflow did:
  # a type error or a stale dist reached main if the author skipped pre-pr (lane ts-gates-prepr-ci, part two; part one is the
  # pre-pr hooks-tsc gate). Separate job: the ratchets job has a 10 minute budget. Each step runs even when an earlier one failed,
  # so one red step does not hide the others. `npx --no-install` never fetches a package from the registry.
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # this job never pushes; keep the git token off disk (zizmor artipacked)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install hooks dependencies (lockfile, no scripts)
        working-directory: .claude/hooks
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hooks type check (tsc --noEmit)
        if: ${{ !cancelled() }}
        working-directory: .claude/hooks
        timeout-minutes: 5
        run: npx --no-install tsc --noEmit
      - name: Hooks build, and dist is not stale
        if: ${{ !cancelled() }}
        working-directory: .claude/hooks
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm run build
          # The committed dist files hold CRLF (Windows autocrlf) and Linux writes LF: compare content, not line endings.
          git diff --exit-code --ignore-cr-at-eol -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      # The package-install-guard tests spawn dist/*.mjs, so this step runs after the build.
      # The flake ledger reporter (card coord-flake-ledger) prints a FLAKE LEDGER line per retry pass and copies only those lines
      # (file:line and counts, never a test name) to the job summary. The runner keeps no history, so the 7-day fail rule acts in pre-pr only.
      # Named reporters replace vitest's defaults, so github-actions (the PR annotations) is named too.
      - name: Hooks tests (vitest)
        if: ${{ !cancelled() }}
        working-directory: .claude/hooks
        timeout-minutes: 20
        run: npx --no-install vitest run --retry=2 --testTimeout=30000 --includeTaskLocation --reporter=default --reporter=github-actions --reporter=./test-support/flake-ledger-reporter.mjs

  # apps/agentic-os has lint, typecheck and build scripts. Before this job CI ran only its pure Playwright specs (ratchets job),
  # so a lint error, a type error or a broken build reached main. The `scope` step turns every later step off unless this change
  # touched apps/agentic-os/ or this workflow: a workflow-level `paths:` filter would also skip the other jobs. `npm run build`
  # runs `prebuild` (eslint) first. The build imports src/db, which throws without AGENTIC_OS_DATABASE_URL: the value below is a
  # placeholder (the pool is lazy, nothing connects, every page is force-dynamic). `next/font/google` fetches JetBrains Mono at build.
  agentic-os:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # this job never pushes; keep the git token off disk (zizmor artipacked)
          fetch-depth: 0               # changed-files.sh diffs against the base commit
      - name: Changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ratchets/changed-files.sh "$BASE_SHA" > "$RUNNER_TEMP/changed.txt"
      - name: Scope (apps/agentic-os or this workflow changed)
        id: scope
        run: |
          if grep -zqE '^(apps/agentic-os/|\.github/workflows/ccv3-checks\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under apps/agentic-os/ or in ccv3-checks.yml: agentic-os checks skipped."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.run == 'true' }}
        with:
          node-version: "22"
      - name: Install root dev dependencies (Playwright test package for the e2e specs, no scripts, no browser download)
        if: ${{ steps.scope.outputs.run == 'true' }}
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install agentic-os dependencies (lockfile, no scripts)
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: apps/agentic-os
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: agentic-os lint
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        working-directory: apps/agentic-os
        timeout-minutes: 5
        run: npm run lint
      - name: agentic-os typecheck
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        working-directory: apps/agentic-os
        timeout-minutes: 5
        run: npm run typecheck
      - name: agentic-os build
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        working-directory: apps/agentic-os
        timeout-minutes: 10
        env:
          AGENTIC_OS_DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder   # never connected; see the job comment
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # The lane board tests build a throwaway database (scripts/coordination/scratch-db.mjs) and run the real render-board.mjs
  # and lane.mjs against it. Before this job no workflow ran them: two render-board tests sat red on main (PR #312, 2026-11-05)
  # while every check was green. Separate job: the ratchets job has a 10 minute budget and already hit it once on a slow checkout.
  # 15 minutes: the last step (the lane-context gate) may use 8 minutes after the test steps, and must reach its database drop.
  coordination-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector 0.8.7 on Postgres 16, built 2026-10-01: the same bits as the dev database in docker/docker-compose.yml.
        # docker/init-schema.sql needs the vector and pg_trgm extensions, so a plain postgres image does not work.
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: claude
          POSTGRES_PASSWORD: claude_dev   # the public dev default in docker/docker-compose.yml; the service lives for this job only
          POSTGRES_DB: continuous_claude
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claude -d continuous_claude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONTINUOUS_CLAUDE_DB_URL: postgresql://claude:claude_dev@localhost:5432/continuous_claude
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # this job never pushes; keep the git token off disk (zizmor artipacked)
          fetch-depth: 0               # lane-project T3 reads an old lane.mjs from git history; a shallow clone silently skips it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The tests resolve the `pg` module from .claude/hooks (same lookup as lane.mjs). Lockfile install, no scripts.
      - name: Install pg (hooks bundle, no scripts)
        working-directory: .claude/hooks
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Explicit file names, not a glob: a missing file fails the step, so this gate cannot pass by finding nothing.
      - name: lane board DB tests (render-board, lane-project, lane-dep-claim, lane-dep-done, lane-dep-seed, scratch-db, lane-inbox-id, lane-holder-flags, lane-parked-scope, learning-counts-db)
        timeout-minutes: 5
        run: node --test scripts/coordination/render-board.test.mjs scripts/coordination/lane-project.test.mjs scripts/coordination/lane-dep-claim.test.mjs scripts/coordination/lane-dep-done.test.mjs scripts/coordination/lane-dep-seed.test.mjs scripts/coordination/scratch-db.test.mjs scripts/coordination/lane-inbox-id.test.mjs scripts/coordination/lane-holder-flags.test.mjs scripts/coordination/lane-parked-scope.test.mjs scripts/coordination/learning-counts-db.test.mjs scripts/coordination/export-dash-data.db.test.mjs scripts/coordination/lane-done-frees-claims.test.mjs
      # These 30 files need no database. They ran only on Dave's Windows machine before this step (lane ci-coordination-no-db-tests).
      # They sit in this job because it already has the checkout with full history and the hooks install.
      - name: lane board tests without a database (kanban, lane-shim,path guard, registry drift, session label, probe boards, probe scratch guard)
        if: ${{ !cancelled() }}   # run even when the DB step failed, so one red step does not hide the other
        timeout-minutes: 5
        run: >-
          node --test
          scripts/coordination/kanban-apply.test.mjs
          scripts/coordination/kanban-card.test.mjs
          scripts/coordination/kanban-client.test.mjs
          scripts/coordination/kanban-place.test.mjs
          scripts/coordination/lane-path-guard.test.mjs
          scripts/coordination/lane-seed-file.test.mjs
          scripts/coordination/lane-shim.test.mjs
          scripts/coordination/lane-band.test.mjs
          scripts/coordination/lane-sort.test.mjs
          scripts/coordination/registry-drift.test.mjs
          scripts/coordination/session-label.test.mjs
          scripts/coordination/probe-boards.test.mjs
          scripts/coordination/process-match.test.mjs
          scripts/coordination/probe-scratch-guard.test.mjs
          scripts/coordination/reminder-sync.test.mjs
          scripts/coordination/run-lock.test.mjs
          scripts/coordination/tick-marker.test.mjs
          scripts/coordination/board-band-view.test.mjs
          scripts/coordination/ask-ledger.test.mjs
          scripts/coordination/stall-alarm-log.test.mjs
          scripts/coordination/learning-counts.test.mjs
          scripts/coordination/board-mask.test.mjs
          scripts/coordination/board-done-view.test.mjs
          scripts/coordination/board-scheduled-view.test.mjs
          scripts/coordination/portfolio.test.mjs
          scripts/coordination/fleetops-view.test.mjs
          scripts/coordination/fleetops-html.test.mjs
          scripts/coordination/wait-ready.test.mjs
          scripts/coordination/gate-lines.test.mjs
          scripts/coordination/run-wrap.test.mjs
          scripts/coordination/v710-check.test.mjs
          scripts/coordination/coord-drill-2/abort.test.mjs
          scripts/coordination/coord-drill-2/judge.test.mjs
          scripts/coordination/coord-drill-2/lib.test.mjs
          scripts/coordination/coord-drill-2/metrics.test.mjs
          scripts/coordination/coord-drill-2/scenarios.test.mjs
      # The privacy test of the --counts mode of failure-audit and ask-rate (card coord-seat-counts). The other tests of that folder run in no gate yet.
      - name: self-improvement tests (counts-mode, append-digest, ask-rate, failure-audit, triage assemble)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node --test scripts/self-improvement/test/counts-mode.test.mjs scripts/self-improvement/test/append-digest.test.mjs scripts/self-improvement/test/ask-rate.test.mjs scripts/self-improvement/test/failure-audit.test.mjs scripts/self-improvement/triage/test/assemble.test.mjs
      # Step 2b of card coord-test-gate-coverage: ten test files of folders with no gate. About 5 s together.
      - name: small script tests (drift, hook trace, safe-replace, token report, tri-model, weekly publish, work tracker, session review)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: >-
          node --test
          scripts/check-agent-model-drift.test.mjs
          scripts/hooks/hook-trace-report.test.mjs
          scripts/hooks/trace-marker-check.test.mjs
          scripts/tools/test/safe-replace.test.mjs
          scripts/usage/token-report.test.mjs
          scripts/tri-model/sync-current-state.test.mjs
          scripts/fourthos-weekly/test/publish-local.test.mjs
          scripts/work-tracker/test/apply-rows.test.mjs
          .claude/skills/session-review/scripts/test/extract.test.mjs
          .claude/skills/session-review/scripts/test/render-html.test.mjs
      # Step 2c of card coord-test-gate-coverage: 33 test files with mocked transports. About 4 s together.
      - name: project-cards and report-registry tests
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: >-
          node --test
          scripts/project-cards/test/aliases.test.mjs
          scripts/project-cards/test/assemble.test.mjs
          scripts/project-cards/test/bind.test.mjs
          scripts/project-cards/test/cockpit-pair.test.mjs
          scripts/project-cards/test/cockpit.test.mjs
          scripts/project-cards/test/digest.test.mjs
          scripts/project-cards/test/history.test.mjs
          scripts/project-cards/test/mobile-brief.test.mjs
          scripts/project-cards/test/notion-create.test.mjs
          scripts/project-cards/test/notion-query.test.mjs
          scripts/project-cards/test/notion-section.test.mjs
          scripts/project-cards/test/page-lock.test.mjs
          scripts/project-cards/test/pm-notes-queue.test.mjs
          scripts/project-cards/test/queue.test.mjs
          scripts/project-cards/test/refresh-batch.test.mjs
          scripts/project-cards/test/state.test.mjs
          scripts/project-cards/test/sweep.test.mjs
          scripts/project-cards/test/triage.test.mjs
          scripts/project-cards/test/util.test.mjs
          scripts/report-registry/test/artifact-url.test.mjs
          scripts/report-registry/test/backfill.test.mjs
          scripts/report-registry/test/check-drift.test.mjs
          scripts/report-registry/test/conventions.test.mjs
          scripts/report-registry/test/detector-coverage-matrix.test.mjs
          scripts/report-registry/test/emit-run.test.mjs
          scripts/report-registry/test/health-mirror.test.mjs
          scripts/report-registry/test/make-run.test.mjs
          scripts/report-registry/test/reconcile.test.mjs
          scripts/report-registry/test/refresh-pages.test.mjs
          scripts/report-registry/test/trust-metrics.test.mjs
          scripts/report-registry/test/upsert.test.mjs
          scripts/report-registry/test/watchdog.test.mjs
          scripts/report-registry/test/weekend-plan.test.mjs
      # lane-context-db.test.ts skips without LANE_TEST_DB_URL, and vitest exits 0 on a skipped file. The program makes a scratch
      # database on this job's service, runs the one file, drops the database, and fails unless every test ran and passed.
      - name: lane-context cursor tests on a scratch database (fails when the file is skipped)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: node scripts/github/lane-context-db-gate.mjs

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_VERSION: "0.75.0"            # immutable release, published 2026-10-01
      TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # this job never pushes; keep the git token off disk (zizmor artipacked)
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install trivy (official release binary, pinned + checksum)
        run: |
          set -euo pipefail
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" trivy && sudo install trivy /usr/local/bin/trivy
          trivy --version
      - name: Changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ratchets/changed-files.sh "$BASE_SHA" > "$RUNNER_TEMP/changed.txt"
      - name: trivy fs (HIGH/CRITICAL)
        run: trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --format json --output "$RUNNER_TEMP/trivy.json" --quiet .
      - name: Trivy ratchet
        run: node scripts/ratchets/scan-ratchet.mjs --tool trivy --report "$RUNNER_TEMP/trivy.json" --baseline scripts/ratchets/trivy-baseline.json --changed "$RUNNER_TEMP/changed.txt"

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # semgrep/semgrep:1.179.0 (published 2026-10-02), pinned by index digest.
      SEMGREP_IMAGE: "semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # this job never pushes; keep the git token off disk (zizmor artipacked)
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ratchets/changed-files.sh "$BASE_SHA" > "$RUNNER_TEMP/changed.txt"
      - name: semgrep scan (p/default)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --metrics=off --json --output /src/.semgrep.json --quiet
          mv .semgrep.json "$RUNNER_TEMP/semgrep.json"
      - name: Semgrep ratchet
        run: node scripts/ratchets/scan-ratchet.mjs --tool semgrep --report "$RUNNER_TEMP/semgrep.json" --baseline scripts/ratchets/semgrep-baseline.json --changed "$RUNNER_TEMP/changed.txt"
      # The repo's own rules (scripts/ratchets/semgrep-ccv3/), built from CodeRabbit Majors #44, #64 and #38.
      # Own baseline (semgrep-ccv3-baseline.json, target: empty) so the p/default baseline stays readable.
      - name: ccv3 rule pack is valid
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep --validate --config scripts/ratchets/semgrep-ccv3 --metrics=off
      - name: ccv3 rule pack fixtures (semgrep --test)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep --test scripts/ratchets/semgrep-ccv3 --metrics=off
      - name: ccv3 rule pack ratchet
        run: node scripts/ratchets/semgrep-ccv3.mjs --changed "$RUNNER_TEMP/changed.txt"
