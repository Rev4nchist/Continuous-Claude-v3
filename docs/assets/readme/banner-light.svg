<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
<title id="t">CCv3: Claude proposes. The harness decides.</title>
<desc id="d">Animated banner. Tool calls travel toward a hook layer. Safe calls pass through to the tools. A destructive command is blocked and sent back.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#e4ecff"/></linearGradient>
<linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#2f5fe0"/><stop offset="1" stop-color="#0e9d86"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5af8"/><stop offset="1" stop-color="#0e9d86"/></linearGradient>
<radialGradient id="h" cx=".68" cy=".5" r=".5"><stop offset="0" stop-color="#7a6bff" stop-opacity=".22"/><stop offset="1" stop-color="#7a6bff" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0b1b44" stroke-opacity=".05"/></pattern>
<filter id="f" x="-300%" y="-20%" width="700%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="r"><rect width="1280" height="400" rx="22"/></clipPath>
</defs>
<style>
text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
.p{opacity:0;animation:pass 9s ease-in-out infinite}
.no{animation-name:deny}
@keyframes pass{0%{transform:translateX(0);opacity:0}6%{transform:translateX(0);opacity:1}38%{transform:translateX(116px);opacity:1}46%{transform:translateX(116px)}88%{transform:translateX(470px);opacity:1}100%{transform:translateX(500px);opacity:0}}
@keyframes deny{0%{transform:translateX(0);opacity:0}6%{transform:translateX(0);opacity:1}38%{transform:translateX(116px);opacity:1}43%{transform:translateX(126px)}47%{transform:translateX(110px)}51%{transform:translateX(120px)}57%{transform:translateX(116px)}80%{transform:translateX(0);opacity:1}94%,100%{transform:translateX(-30px);opacity:0}}
.st{opacity:0;animation:st 9s infinite;animation-delay:-2.4s}
@keyframes st{0%,44%{opacity:0;transform:scale(1.6)}50%{opacity:1;transform:scale(1)}74%{opacity:1}84%,100%{opacity:0}}
.fl{opacity:0;animation:fl 9s infinite;animation-delay:-2.4s}
@keyframes fl{0%,42%{opacity:0}45%{opacity:.9}62%,100%{opacity:0}}
.rg{opacity:0;transform-origin:860px 200px;animation:rg 9s infinite;animation-delay:-2.4s}
@keyframes rg{0%,43%{opacity:0;transform:scale(.3)}46%{opacity:.8}70%,100%{opacity:0;transform:scale(2.6)}}
.pu{animation:pu 3s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.78}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.p,.st,.pu{animation:none;opacity:1}.fl,.rg{animation:none;opacity:0}.a1{transform:translateX(470px)}.a2{transform:translateX(116px)}.a3{transform:translateX(0)}}
</style>
<g clip-path="url(#r)">
<rect width="1280" height="400" fill="url(#bg)"/><rect width="1280" height="400" fill="url(#gr)"/><rect width="1280" height="400" fill="url(#h)"/>
<text x="62" y="146" font-size="118" font-weight="800" fill="url(#w)" letter-spacing="-3">CCv3</text>
<text x="68" y="210" font-size="34" font-weight="700" fill="#0b1220">Claude proposes.</text>
<text x="68" y="254" font-size="34" font-weight="700" fill="#0b1220">The harness decides.</text>
<text x="68" y="292" font-size="16" fill="#4b5a7a">A governed harness for Claude Code</text>
<g transform="translate(68 322)"><rect width="63" height="26" rx="13" fill="#0b1b44" fill-opacity=".05" stroke="#0b1b44" stroke-opacity=".16"/><text x="31" y="17.5" font-size="12.5" class="m" text-anchor="middle" fill="#33466e">hooks</text></g><g transform="translate(139 322)"><rect width="63" height="26" rx="13" fill="#0b1b44" fill-opacity=".05" stroke="#0b1b44" stroke-opacity=".16"/><text x="31" y="17.5" font-size="12.5" class="m" text-anchor="middle" fill="#33466e">rules</text></g><g transform="translate(209 322)"><rect width="71" height="26" rx="13" fill="#0b1b44" fill-opacity=".05" stroke="#0b1b44" stroke-opacity=".16"/><text x="35" y="17.5" font-size="12.5" class="m" text-anchor="middle" fill="#33466e">memory</text></g><g transform="translate(288 322)"><rect width="71" height="26" rx="13" fill="#0b1b44" fill-opacity=".05" stroke="#0b1b44" stroke-opacity=".16"/><text x="35" y="17.5" font-size="12.5" class="m" text-anchor="middle" fill="#33466e">agents</text></g><g transform="translate(366 322)"><rect width="103" height="26" rx="13" fill="#0b1b44" fill-opacity=".05" stroke="#0b1b44" stroke-opacity=".16"/><text x="52" y="17.5" font-size="12.5" class="m" text-anchor="middle" fill="#33466e">guardrails</text></g><g transform="translate(477 322)"><rect width="54" height="26" rx="13" fill="#0b1b44" fill-opacity=".05" stroke="#0b1b44" stroke-opacity=".16"/><text x="27" y="17.5" font-size="12.5" class="m" text-anchor="middle" fill="#33466e">logs</text></g>
<g stroke="#0b1b44" stroke-opacity=".14" stroke-dasharray="4 8"><line x1="560" y1="110" x2="1250" y2="110"/><line x1="560" y1="200" x2="1250" y2="200"/><line x1="560" y1="290" x2="1250" y2="290"/></g>
<text x="560" y="50" font-size="12" letter-spacing="2.5" fill="#5d6d90">CLAUDE PROPOSES</text>
<rect x="1128" y="70" width="122" height="260" rx="18" fill="#0e9d86" fill-opacity=".07" stroke="#0e9d86" stroke-opacity=".4"/>
<text x="1189" y="50" font-size="12" letter-spacing="2.5" text-anchor="middle" fill="#0a7f6c">TOOLS</text>
<text x="1189" y="352" font-size="12" class="m" text-anchor="middle" fill="#5d6d90">shell · files · git</text>
<g class="pu"><rect x="852" y="70" width="16" height="260" rx="8" fill="url(#g)" filter="url(#f)"/></g>
<rect class="fl" x="850" y="70" width="20" height="260" rx="10" fill="#d92f40" filter="url(#f)"/>
<circle class="rg" cx="860" cy="200" r="40" fill="none" stroke="#d92f40" stroke-width="3"/>
<text x="860" y="50" font-size="12" letter-spacing="2.5" text-anchor="middle" fill="#5b3fd6">HOOK LAYER</text>
<text x="860" y="352" font-size="12" class="m" text-anchor="middle" fill="#5d6d90">allow · ask · deny · log</text>
<g transform="translate(560 92)"><g class="p ok a1" style="animation-delay:-5.4s"><rect width="176" height="36" rx="11" fill="#e6fbf6" stroke="#0e9d86" stroke-width="1.5"/><circle cx="17" cy="18" r="5" fill="#0e9d86"/><text x="32" y="23.5" font-size="14" class="m" fill="#07423a">git status</text></g></g>
<g transform="translate(560 182)"><g class="p no a2" style="animation-delay:-2.4s"><rect width="176" height="36" rx="11" fill="#fff1de" stroke="#d9801a" stroke-width="1.5"/><circle cx="17" cy="18" r="5" fill="#d9801a"/><text x="32" y="23.5" font-size="14" class="m" fill="#5a3207">git reset --hard</text></g></g>
<g transform="translate(560 272)"><g class="p ok a3" style="animation-delay:-7.8s"><rect width="176" height="36" rx="11" fill="#e6fbf6" stroke="#0e9d86" stroke-width="1.5"/><circle cx="17" cy="18" r="5" fill="#0e9d86"/><text x="32" y="23.5" font-size="14" class="m" fill="#07423a">npm test</text></g></g>
<g transform="translate(884 207) rotate(-5)"><g class="st"><rect x="-8" y="-24" width="128" height="34" rx="8" fill="#d92f40" fill-opacity=".16" stroke="#d92f40" stroke-width="2"/><text x="56" y="0" font-size="20" font-weight="800" letter-spacing="3" text-anchor="middle" fill="#b3202f">BLOCKED</text></g></g>
</g>
</svg>
