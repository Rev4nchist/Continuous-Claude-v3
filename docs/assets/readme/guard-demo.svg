<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="960" height="346" role="img" aria-labelledby="t d">
<title id="t">The destructive-command guard, captured from a real run</title>
<desc id="d">Claude proposes git reset --hard origin/main. When you are at the keyboard the guard asks for confirmation. In an unattended run it denies with BLOCKED fail-closed.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101b"/><stop offset="1" stop-color="#0c1d2e"/></linearGradient></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:15px;fill:#d7e4f5}.m{fill:#7f93a8;font-size:13px}.c{fill:#e8fff6;font-size:17px}.ask{fill:#ffc979}.deny{fill:#ff8d97}.ok{fill:#5af2bd}.sans{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}</style>
<rect width="960" height="346" rx="16" fill="url(#bg)" stroke="#24415a"/>
<path d="M0 16A16 16 0 0 1 16 0H944A16 16 0 0 1 960 16V40H0Z" fill="#0d1a28"/>
<circle cx="28" cy="20" r="6" fill="#ff5f57"/><circle cx="50" cy="20" r="6" fill="#febc2e"/><circle cx="72" cy="20" r="6" fill="#28c840"/>
<text class="m sans" x="480" y="25" text-anchor="middle">destructive-command-guard · real output</text>
<text class="c" x="32" y="76">❯ git reset --hard origin/main</text>
<text class="m" x="32" y="106">at the keyboard</text>
<text class="ask" x="32" y="132">ask  CONFIRM: this is a destructive command</text>
<text class="m" x="32" y="154">     Matched: git reset --hard. Approve only if you intend this irreversible operation.</text>
<line x1="32" y1="180" x2="928" y2="180" stroke="#24415a" stroke-dasharray="4 6"/>
<text class="c" x="32" y="214">❯ git reset --hard origin/main</text>
<text class="m" x="32" y="244">unattended run (bypassPermissions)</text>
<text class="deny" x="32" y="270">deny BLOCKED (fail-closed): destructive command in an unattended/bypass context</text>
<text class="m" x="32" y="292">     An interactive confirmation would hang a headless run, so this is denied.</text>
<text class="ok" x="32" y="322" style="font-size:13px">git status · git commit -F msg.txt  →  allowed, no prompt</text>
</svg>
