<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
<title id="t">From idea to merge: six stages, each guarded by a gate</title>
<desc id="d">Plan, build, verify, review, land and learn. Under each stage is the gate that guards it: plan approval, claims and guards, saved end-to-end output, the READY check, the operator's yes, and a recorded handoff outcome.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#14224a"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f93bd"/></marker>
</defs>
<style>text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-anchor:middle}.n{font-size:11px;font-weight:800;fill:#fff;fill-opacity:.7;letter-spacing:1.5px}.h{font-size:17px;font-weight:800;fill:#fff}.s{font-size:11.5px;fill:#e8eefc;fill-opacity:.92}.g{font-size:11.5px;fill:#ffd9a0}.gl{font-size:10px;letter-spacing:2px;fill:#7f93bd}</style>
<rect width="960" height="250" rx="18" fill="url(#bg)"/>
<text class="gl" x="480" y="34">SIX STAGES, EACH WITH A GATE</text>
<g>
<rect x="24" y="52" width="135" height="84" rx="14" fill="#2f6fed"/><text class="n" x="91" y="74">STAGE 1</text><text class="h" x="91" y="96">Plan</text><text class="s" x="91" y="118">idea to approved plan</text>
<rect x="177" y="52" width="135" height="84" rx="14" fill="#7a5af8"/><text class="n" x="244" y="74">STAGE 2</text><text class="h" x="244" y="96">Build</text><text class="s" x="244" y="118">tests first, then code</text>
<rect x="330" y="52" width="135" height="84" rx="14" fill="#0e9d86"/><text class="n" x="397" y="74">STAGE 3</text><text class="h" x="397" y="96">Verify</text><text class="s" x="397" y="118">end-to-end check</text>
<rect x="483" y="52" width="135" height="84" rx="14" fill="#c2610c"/><text class="n" x="550" y="74">STAGE 4</text><text class="h" x="550" y="96">Review</text><text class="s" x="550" y="118">CI and bot review</text>
<rect x="636" y="52" width="135" height="84" rx="14" fill="#b8325a"/><text class="n" x="703" y="74">STAGE 5</text><text class="h" x="703" y="96">Land</text><text class="s" x="703" y="118">merge and sync</text>
<rect x="789" y="52" width="147" height="84" rx="14" fill="#475569"/><text class="n" x="862" y="74">STAGE 6</text><text class="h" x="862" y="96">Learn</text><text class="s" x="862" y="118">handoff and improve</text>
</g>
<g stroke="#7f93bd" stroke-width="2" marker-end="url(#a)"><line x1="159" y1="94" x2="175" y2="94"/><line x1="312" y1="94" x2="328" y2="94"/><line x1="465" y1="94" x2="481" y2="94"/><line x1="618" y1="94" x2="634" y2="94"/><line x1="771" y1="94" x2="787" y2="94"/></g>
<g stroke="#ffb454" stroke-opacity=".55" stroke-dasharray="3 5"><line x1="91" y1="138" x2="91" y2="162"/><line x1="244" y1="138" x2="244" y2="162"/><line x1="397" y1="138" x2="397" y2="162"/><line x1="550" y1="138" x2="550" y2="162"/><line x1="703" y1="138" x2="703" y2="162"/><line x1="862" y1="138" x2="862" y2="162"/></g>
<g fill="#33200f" stroke="#ffb454" stroke-width="1.2">
<rect x="24" y="162" width="135" height="50" rx="10"/><rect x="177" y="162" width="135" height="50" rx="10"/><rect x="330" y="162" width="135" height="50" rx="10"/><rect x="483" y="162" width="135" height="50" rx="10"/><rect x="636" y="162" width="135" height="50" rx="10"/><rect x="789" y="162" width="147" height="50" rx="10"/>
</g>
<text class="g" x="91" y="183">plan approval</text><text class="g" x="91" y="200">asked first</text>
<text class="g" x="244" y="183">claims + guards</text><text class="g" x="244" y="200">run on each call</text>
<text class="g" x="397" y="183">saved output</text><text class="g" x="397" y="200">proves it works</text>
<text class="g" x="550" y="183">READY check</text><text class="g" x="550" y="200">CI + threads</text>
<text class="g" x="703" y="183">your yes</text><text class="g" x="703" y="200">no tool merges</text>
<text class="g" x="862" y="183">outcome recorded</text><text class="g" x="862" y="200">in each handoff</text>
<text class="gl" x="480" y="236">THE HARNESS ENFORCES THE LIFECYCLE</text>
</svg>
