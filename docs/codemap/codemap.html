<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>continuous-claude (CCv3) code map</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#1d2531; --line:#2f3a48; --text:#e6edf3; --muted:#a3adba;
  --accent:#58a6ff; --red:#ff7b72; --ok:#3fb950; --warn:#e3b341; --hl:#ffd33d; --up:#e3b341; --down:#39c5cf;
  --shadow:0 4px 18px rgba(0,0,0,.45);
  --k-module:#4f8cff; --k-tooling:#22c3a6; --k-service:#b07cff; --k-ui:#f2a93b; --k-database:#ef6b6b; --k-queue:#e9d45a; --k-external:#9aa4b2;
  --e-imports:#8b949e; --e-calls:#58a6ff; --e-reads:#3fb950; --e-writes:#f0883e; --e-publishes:#bc8cff; --e-subscribes:#ff7eb6; --e-unknown:#9aa4b2;
  --region-fill:rgba(88,166,255,.05); --region-line:rgba(88,166,255,.35); --region-text:#8fb8ea;
}
:root[data-theme="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f5; --line:#c9d1da; --text:#1f2328; --muted:#555f6b;
  --accent:#0969da; --red:#c4202b; --ok:#1a7f37; --warn:#9a6700; --hl:#b35900; --up:#9a6700; --down:#0a7c86;
  --shadow:0 4px 18px rgba(30,40,60,.18);
  --k-module:#2f6fe0; --k-tooling:#0f8f78; --k-service:#7b4fd0; --k-ui:#c47a0a; --k-database:#d1383d; --k-queue:#a08a00; --k-external:#667281;
  --e-imports:#6e7781; --e-calls:#0969da; --e-reads:#1a7f37; --e-writes:#c75f0f; --e-publishes:#7e4fd0; --e-subscribes:#c2307a; --e-unknown:#667281;
  --region-fill:rgba(9,105,218,.05); --region-line:rgba(9,105,218,.4); --region-text:#2a5aa0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px;min-width:0}
.meta b{color:var(--text);font-weight:600}
.badge{display:inline-block;padding:0 7px;border-radius:9px;border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.spacer{flex:1}
@media (max-width:760px){.spacer{display:none}.btn#theme{margin-left:auto}}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12.5px}
.btn:hover{border-color:var(--accent)}

/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr) 348px}
main.nol{grid-template-columns:minmax(0,1fr) 348px}
main.nor{grid-template-columns:236px minmax(0,1fr)}
main.nol.nor{grid-template-columns:minmax(0,1fr)}
main.nol #controls,main.nor #side{display:none}
#controls,#side{background:var(--panel);overflow:auto;min-height:0;min-width:0}
#controls{border-right:1px solid var(--line);padding:12px}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column}
#stage{position:relative;min-width:0;min-height:0;background:var(--bg)}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.panning{cursor:grabbing}
footer{display:flex;flex-wrap:wrap;gap:2px 16px;padding:5px 14px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px}
footer b{color:var(--text)}

/* controls */
.sec{margin:0 0 14px}
.sec h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
#q{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
#qinfo{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
#qres{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:2px}
#qres button{width:100%;text-align:left;background:none;border:0;padding:3px 6px;border-radius:5px;font-size:12.5px}
#qres button:hover{background:var(--panel2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:12px}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.flowbtn{display:grid;grid-template-columns:24px 1fr;gap:2px 8px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.flowbtn small{grid-column:2;color:var(--muted);font-size:11.5px}
.flowbtn[aria-pressed="true"]{border-color:var(--hl);box-shadow:0 0 0 1px var(--hl) inset}
.flowbtn.has{border-color:var(--accent)}
.fnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#0d1117;font-weight:700;font-size:12px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.legend{display:grid;gap:4px;font-size:12.5px}
.legend .it{display:flex;align-items:center;gap:8px}
.legend .it span.sw{width:14px;height:14px;border-radius:4px;flex:none}
.legend .ln{width:22px;height:0;border-top:2.5px solid;flex:none}
.redsample{color:var(--red);font-weight:700}

/* stage overlays */
#zoomctl{position:absolute;right:10px;top:10px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:var(--shadow)}
#zoomctl button{min-width:30px;height:28px;background:var(--panel2);border:1px solid var(--line);border-radius:5px}
#zoomctl button:hover{border-color:var(--accent)}
#zlbl{min-width:42px;text-align:center;font-size:12px;color:var(--muted)}
#hint{position:absolute;left:10px;top:10px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;max-width:55%}
#overlegend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;box-shadow:var(--shadow)}
#overlegend .it{display:flex;align-items:center;gap:5px}
#overlegend .sw{width:11px;height:11px;border-radius:3px}

/* svg */
.region rect{fill:var(--region-fill);stroke:var(--region-line);stroke-width:1.2;stroke-dasharray:6 4}
.region text{fill:var(--region-text);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.node{cursor:pointer;outline:none}
.node .nbox{fill:var(--panel2);stroke:var(--nk,var(--line));stroke-width:1.4}
.node .kbar{fill:var(--nk)}
.node .nid{fill:var(--text);font-size:13.5px;font-weight:700}
.node .nsub{fill:var(--muted);font-size:10px;font-family:ui-monospace,Consolas,monospace}
.node .nw{font-size:11px;fill:var(--muted)}
.node .nw .w.red{fill:var(--red);font-weight:700}
.node .nw .w.ok{fill:var(--text)}
.svg-nowords .node .nw{display:none}
.node:focus-visible .nbox{stroke:var(--hl);stroke-width:3}
.node:hover .nbox{stroke-width:2.4}
.node.sel .nbox{stroke:var(--hl);stroke-width:3.4}
.node.up1 .nbox{stroke:var(--up);stroke-width:3}
.node.up2 .nbox{stroke:var(--up);stroke-width:1.8;stroke-dasharray:5 3}
.node.dn1 .nbox{stroke:var(--down);stroke-width:3}
.node.dn2 .nbox{stroke:var(--down);stroke-width:1.8;stroke-dasharray:5 3}
.node.both .nbox{stroke:var(--accent);stroke-width:3}
.node.inflow .nbox{stroke:var(--hl);stroke-width:2.6}
.node.match .nbox{stroke:var(--accent);stroke-width:3}
.node.dim{opacity:.2}
.node.dimq{opacity:.16}
.node.hid,.edge.hid,.region.hid{display:none}
.stepbadge circle{fill:var(--hl);stroke:var(--bg);stroke-width:1.5}
.stepbadge text{fill:#14171c;font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.fdot{stroke:var(--bg);stroke-width:1}
.node .tcount{fill:var(--muted);font-size:10px;text-anchor:end}
.edge .main{fill:none;stroke:var(--ec);stroke-width:1.3;opacity:.4;stroke-linecap:round}
.edge .hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.edge .ov{fill:none;stroke:var(--bg);stroke-width:1.6;stroke-dasharray:2 10;opacity:0;stroke-linecap:round}
.edge.unknown .main{stroke-dasharray:5 5}
.edge.flowedge .main{opacity:.92;stroke-width:2.2}
.edge:hover .main{opacity:1;stroke-width:2.6}
.edge.up .main{stroke:var(--up);opacity:1;stroke-width:2.6}
.edge.down .main{stroke:var(--down);opacity:1;stroke-width:2.6}
.edge.flowhl .main{stroke:var(--hl);opacity:1;stroke-width:3.4;stroke-dasharray:none}
.edge.flowhl .ov{opacity:.9;animation:flow .9s linear infinite}
.edge.sel .main{stroke:var(--hl);opacity:1;stroke-width:3.6}
.edge.dim{opacity:.1}
.edge.dimq{opacity:.1}
.edge .badge2 circle{fill:var(--hl);stroke:var(--bg);stroke-width:1.5}
.edge .badge2 text{fill:#14171c;font-size:10.5px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.edge .badge2{display:none}
.edge.flowhl .badge2{display:inline}
.ah{fill:var(--ec)}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.edge.flowhl .ov{animation:none}}

/* side panel */
#tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;flex:none}
#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;font-size:12.5px;color:var(--muted);font-weight:600}
#tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.pane{padding:12px 14px 40px;display:none;overflow:auto;flex:1;min-height:0}
.pane.on{display:block}
.pane h3{margin:0 0 4px;font-size:15px}
.pane h4{margin:14px 0 5px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pane ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pane li{padding:4px 7px;background:var(--panel2);border-radius:6px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:0 7px;border-radius:9px;font-size:11.5px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.k{color:var(--text)}
.al{display:grid;grid-template-columns:1fr auto;gap:0 8px}
.al .w{font-weight:700}
.al.red .w{color:var(--red)}
.al.red .w::after{content:" (not the code name)";font-weight:400;font-size:11px}
.al .src{grid-column:1;color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.al .st{grid-row:1;grid-column:2;font-size:11px;color:var(--ok)}
.al.unk .st{color:var(--warn)}
.al.unk .st::before{content:"? "}
.sym{color:var(--muted);font-size:11.5px;display:block;overflow-wrap:anywhere}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-align:left;overflow-wrap:anywhere}
.up-t{color:var(--up)} .dn-t{color:var(--down)}
.note{color:var(--muted);font-size:12.5px;margin:4px 0}
ol.steps{list-style:none;counter-reset:s;margin:6px 0 0;padding:0;display:grid;gap:6px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px;background:var(--panel2);padding:7px 8px;border-radius:8px}
ol.steps li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--hl);color:#14171c;font-weight:800;font-size:12px}

/* words vs names */
.wv-head,.wv-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}
.wv-head{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px 6px;position:sticky;top:0;background:var(--panel)}
.wv-row{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2);cursor:pointer;width:100%;text-align:left}
.wv-row:hover{border-color:var(--accent)}
.wv-row .our{font-weight:700;overflow-wrap:anywhere}
.wv-row.bad .our{color:var(--red)}
.wv-row.good .our{color:var(--ok)}
.wv-row .mean{color:var(--muted);font-size:12px;margin-top:2px}
.wv-row .why{font-size:12px;color:var(--muted);margin-top:3px}
.wv-row code{display:block}
.risk{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.risk i{width:6px;height:10px;border-radius:2px;background:var(--line);display:inline-block}
.risk i.on{background:var(--red)}
.risk.good i.on{background:var(--ok)}

#mnav{display:none}

@media (max-width:760px){
  header{padding:5px 10px;gap:2px 10px}
  header h1{font-size:14px}
  .meta{font-size:11.5px;gap:2px 10px}
  .meta .badge{display:none}
  .btn#theme{padding:2px 8px;font-size:12px}
  footer span:last-child{display:none}
  main{display:flex;flex-direction:column}
  #stage{flex:1 1 auto;min-height:150px}
  #controls,#side{display:none;flex:0 0 auto;height:44vh;border:0;border-top:1px solid var(--line)}
  body[data-sheet="controls"] #controls{display:block}
  body[data-sheet="side"] #side{display:flex}
  #hint,#overlegend,.tgl{display:none}
  #mnav{display:flex;background:var(--panel);border-top:1px solid var(--line)}
  #mnav button{flex:1;background:none;border:0;padding:10px 2px;font-size:13px;font-weight:600;color:var(--muted)}
  #mnav button[aria-pressed="true"]{color:var(--text);box-shadow:0 -3px 0 var(--accent) inset}
  footer{padding:3px 10px;font-size:11px}
  .wv-head,.wv-row{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px}
}
</style>
</head>

    return items.map(function (it) {
      var id = it[1], es = (dir === 'up' ? outE[id] : inE[id]).filter(function (e) { return dir === 'up' ? e.to === S.sel : e.from === S.sel; }).map(function (e) { return e.type; });
      return '<li>' + nodeLink(id) + ' <span class="tag">' + (it[0] === 1 ? 'direct' : 'via ' + it[0]) + '</span>' + (es.length ? '<span class="tag">' + esc(es.join(', ')) + '</span>' : '') + '</li>';
    }).join('');
  }
  h += '<h4 class="up-t">Upstream callers (' + up.size + ')</h4>' + (up.size ? '<ul>' + nbrs('up', up) + '</ul>' : '<p class="note">none</p>');
  h += '<h4 class="dn-t">Downstream dependencies (' + dn.size + ')</h4>' + (dn.size ? '<ul>' + nbrs('down', dn) + '</ul>' : '<p class="note">none</p>');
  h += '<h4>Related tests (' + n.tests.length + ')</h4>' + (n.tests.length ? '<ul>' + n.tests.map(function (t) { return '<li class="mono">' + esc(t) + '</li>'; }).join('') + '</ul>' : '<p class="note">none recorded</p>');
  h += '<h4>Flows it belongs to (' + flowsOfNode[n.id].length + ')</h4>' + (flowsOfNode[n.id].length ? '<ul>' + flowsOfNode[n.id].map(function (fi) { return '<li>' + flowLink(fi) + '</li>'; }).join('') + '</ul>' : '<p class="note">none</p>');
  h += '<h4>Entrypoints</h4>' + (n.entrypoints.length ? '<ul>' + n.entrypoints.map(function (t) { return '<li class="mono">' + esc(t) + '</li>'; }).join('') + '</ul>' : '<p class="note">none recorded</p>');
  h += '<h4>Constraints</h4>' + (n.constraints.length ? '<ul>' + n.constraints.map(function (c) { return '<li>' + esc(c.rule) + (c.evidence === 'unknown' ? '<span class="sym">evidence: unknown</span>' : c.evidence.map(function (x) { return '<span class="sym">' + esc(x.path) + ' : ' + esc(x.symbol) + '</span>'; }).join('')) + '</li>'; }).join('') + '</ul>' : '<p class="note">none recorded</p>');
  h += '<h4>Evidence (path and symbol)</h4>' + evList(n.evidence);
  el.innerHTML = h;
}
function renderFlowPane() {
  var el = $('#p-flow'), h = '';
  if (S.flow === null) {
    h += '<h3>End-to-end flows</h3><p class="note">Pick a flow to highlight its whole path in order.</p><ul>';
    F.forEach(function (f, fi) { h += '<li>' + flowLink(fi) + '<span class="sym">' + esc(f.trigger) + '</span></li>'; });
    el.innerHTML = h + '</ul>'; return;
  }
  var f = F[S.flow];
  h += '<h3>' + (S.flow + 1) + '. ' + esc(f.name) + '</h3><h4>Trigger</h4><p>' + esc(f.trigger) + '</p><h4>Steps</h4><ol class="steps">';
  f.steps.forEach(function (s) {
    h += '<li><div>' + nodeLink(s.node) + (s.edge_type ? ' <span class="tag">' + esc(s.edge_type) + '</span>' : '') + (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') + '</div></li>';
  });
  h += '</ol>';
  if ((f.unknown_joins && f.unknown_joins.length) || (f.rests_on_unknown && f.rests_on_unknown.length)) {
    h += '<h4>Unknown links in this flow</h4><ul>';
    (f.unknown_joins || []).forEach(function (u) { h += '<li><span class="tag">no edge</span> ' + esc(u.from) + ' to ' + esc(u.to) + (u.note ? '<span class="sym">' + esc(u.note) + '</span>' : '') + '</li>'; });
    (f.rests_on_unknown || []).forEach(function (k) { h += '<li><span class="tag">unknown edge</span> <span class="mono">' + esc(k) + '</span></li>'; });
    h += '</ul>';
  }
  h += '<h4>Outcome</h4><p>' + esc(f.outcome) + '</p><p><button type="button" class="btn" data-flow="-1">Clear flow</button></p>';
  el.innerHTML = h;
}
function riskBar(r, good) { var s = '<span class="risk' + (good ? ' good' : '') + '" aria-label="risk ' + r + ' of 5">'; for (var i = 1; i <= 5; i++) s += '<i class="' + (i <= r ? 'on' : '') + '"></i>'; return s + '</span>'; }
function renderWords() {
  var rows = D.words.slice().map(function (w, i) { return { w: w, i: i }; }).sort(function (a, b) {
    return (b.w.risk - a.w.risk) || ((a.w.matches ? 1 : 0) - (b.w.matches ? 1 : 0)) || a.i - b.i;
  });
  var bad = D.words.filter(function (w) { return !w.matches; }).length;
  var h = '<h3>Words vs names</h3><p class="note">' + bad + ' of ' + D.words.length + ' words do not match the code (red). Most likely to cause a wrong edit first. Click a row to find the module.</p>';
  h += '<div class="wv-head"><div>Our words</div><div>The code\'s names and paths</div></div>';
  rows.forEach(function (r) {
    var w = r.w;
    h += '<button type="button" class="wv-row ' + (w.matches ? 'good' : 'bad') + '" data-node="' + esc(w.node_id || '') + '">' +
      '<div><div class="our">' + esc(w.word) + (w.matches ? '' : ' (no match)') + riskBar(w.risk, w.matches) + '</div><div class="mean">' + esc(w.meaning || '') + '</div>' +
      '<div class="why">Change: ' + (w.change === 'code' ? "the code's name" : 'our word') + '</div></div>' +
      '<div><div>' + esc(w.code_name) + '</div>' + (w.paths || [w.path]).map(function (p) { return '<code>' + esc(p) + '</code>'; }).join('') + '<div class="why">' + esc(w.why || '') + '</div></div></button>';
  });
  $('#p-words').innerHTML = h;
}
function renderUnknown() {
  var ue = E.filter(function (e) { return e.evidence === 'unknown'; });
  var ua = []; N.forEach(function (n) { n.aliases.forEach(function (a) { if (a.status === 'unknown') ua.push([n, a]); }); });
  var un = N.filter(function (n) { return n.evidence === 'unknown'; });
  var h = '<h3>Remaining unknowns</h3><p class="note">Nothing here is guessed. Each item has no source evidence. Dashed lines on the map are the unknown relationships.</p>';
  h += '<h4>Relationships (' + ue.length + ')</h4>' + (ue.length ? '<ul>' + ue.map(function (e) { return '<li><button type="button" class="lnk" data-edge="' + esc(ekey(e)) + '">' + esc(e.from + ' ' + e.type + ' ' + e.to) + '</button>' + (e.note ? '<span class="sym">' + esc(e.note) + '</span>' : '') + '</li>'; }).join('') + '</ul>' : '<p class="note">none</p>');
  h += '<h4>Words (' + ua.length + ')</h4>' + (ua.length ? '<ul>' + ua.map(function (x) { return '<li>' + nodeLink(x[0].id) + ': <b>' + esc(x[1].word) + '</b><span class="sym">' + esc(x[1].source_kind) + ': ' + esc(srcLabel(x[1])) + '</span></li>'; }).join('') + '</ul>' : '<p class="note">none</p>');
  h += '<h4>Modules without evidence (' + un.length + ')</h4>' + (un.length ? '<ul>' + un.map(function (n) { return '<li>' + nodeLink(n.id) + '</li>'; }).join('') + '</ul>' : '<p class="note">none</p>');
  $('#p-unknown').innerHTML = h;
}
function setTab(t) {
  S.tab = t;
  $$('#tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === t ? 'true' : 'false'); });
  $$('.pane').forEach(function (p) { p.classList.toggle('on', p.id === 'p-' + t); });
}

// ---- actions
var mobile = window.matchMedia('(max-width: 760px)');
function setSheet(s) {
  document.body.setAttribute('data-sheet', s);
  $$('#mnav button').forEach(function (b) {
    var on = b.getAttribute('data-sheet') === s && (s !== 'side' || b.getAttribute('data-tab') === (S.tab === 'words' ? 'words' : 'details'));
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  setTimeout(function () { if (!userMoved) fit(); }, 0);
}
function announce(t) { $('#live').textContent = t; }
function selectNode(id) {
  S.sel = id; S.selEdge = null; S.flow = null;
  renderDetails(); renderFlowPane(); setTab('details'); applyState();
  if (mobile.matches) setSheet('side');
  announce('Selected ' + id + '. ' + reach(id, 'up').size + ' upstream, ' + reach(id, 'down').size + ' downstream.');
}
function selectEdge(k) {
  S.selEdge = k; S.sel = null; S.flow = null;
  renderDetails(); renderFlowPane(); setTab('details'); applyState();
  if (mobile.matches) setSheet('side');
}
function selectFlow(fi) {
  if (fi < 0 || S.flow === fi) { S.flow = null; renderFlowPane(); applyState(); renderDetails(); return; }
  S.flow = fi; S.sel = null; S.selEdge = null;
  renderFlowPane(); renderDetails(); setTab('flow'); applyState();
  if (mobile.matches) setSheet('side');
  announce('Flow ' + (fi + 1) + ': ' + F[fi].name + ', ' + F[fi].steps.length + ' steps.');
}
function clearSel() { S.sel = null; S.selEdge = null; S.flow = null; renderDetails(); renderFlowPane(); applyState(); }

// ---- controls
function chip(parent, label, color, on, cb) {
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = (color ? '<span class="sw" style="background:' + color + '"></span>' : '') + esc(label);
  b.addEventListener('click', function () { var p = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', p ? 'true' : 'false'); cb(p); });
  parent.appendChild(b);
}
function refilter() { updateGeometry(); applyState(); if (!userMoved) fit(); }
D.legend.forEach(function (l) {
  chip($('#kindchips'), l.kind, 'var(--k-' + l.kind + ')', true, function (p) { p ? S.kinds.add(l.kind) : S.kinds.delete(l.kind); refilter(); });
});
D.boundaries.forEach(function (b) {
  chip($('#boundchips'), b.label, null, true, function (p) { p ? S.bounds.add(b.id) : S.bounds.delete(b.id); refilter(); });
});
TYPES.forEach(function (t) {
  chip($('#typechips'), t, 'var(--e-' + t + ')', true, function (p) { p ? S.types.add(t) : S.types.delete(t); applyState(); });
});
F.forEach(function (f, fi) {
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'flowbtn'; b.setAttribute('data-flow', fi); b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<span class="fnum" style="background:' + FCOL[fi % FCOL.length] + '">' + (fi + 1) + '</span><span>' + esc(f.name) + '</span><small>' + f.steps.length + ' steps</small>';
  $('#flowlist').appendChild(b);
});
(function legend() {
  var h = '';
  D.legend.forEach(function (l) { h += '<div class="it"><span class="sw" style="background:var(--k-' + l.kind + ')"></span><span><b>' + esc(l.kind) + '</b>: ' + esc(l.meaning) + '</span></div>'; });
  TYPES.forEach(function (t) { h += '<div class="it"><span class="ln" style="border-color:var(--e-' + t + ')"></span><span>' + t + '</span></div>'; });
  h += '<div class="it"><span class="ln" style="border-color:var(--e-unknown);border-top-style:dashed"></span><span>unknown: no source evidence</span></div>';
  h += '<div class="it"><span class="redsample">red</span><span>a word that is not the code name</span></div>';
  h += '<div class="it"><span class="sw" style="background:' + FCOL[0] + ';border-radius:50%;width:10px;height:10px"></span><span>dot: module is in a flow (colour = flow)</span></div>';
  $('#legend').innerHTML = h;
  var o = '';
  D.legend.forEach(function (l) { o += '<span class="it"><span class="sw" style="background:var(--k-' + l.kind + ')"></span>' + esc(l.kind) + '</span>'; });
  o += '<span class="it"><span class="redsample">red</span> word is not the code name</span><span class="it">dashed line = unknown</span>';
  $('#overlegend').innerHTML = o;
})();
$('#q').addEventListener('input', function (e) { S.q = e.target.value; applyState(); });
$('#q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { var f = $('#qres button'); if (f) { selectNode(f.getAttribute('data-node')); centerOn(f.getAttribute('data-node')); } }
  if (e.key === 'Escape') { e.target.value = ''; S.q = ''; applyState(); }
});
$('#showwords').addEventListener('change', function (e) { svg.classList.toggle('svg-nowords', !e.target.checked); });
$('#resetview').addEventListener('click', function () { clearSel(); userMoved = false; fit(); });
$('#tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setTab(b.getAttribute('data-tab')); });
$('#mnav').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.getAttribute('data-tab')) setTab(b.getAttribute('data-tab'));
  setSheet(b.getAttribute('data-sheet'));
});
// one delegated handler for links inside panels and the controls
document.addEventListener('click', function (e) {
  var t = e.target.closest && e.target.closest('[data-node],[data-flow],[data-edge]');
  if (!t || t.closest('#svg')) return;
  if (t.hasAttribute('data-edge')) { selectEdge(t.getAttribute('data-edge')); return; }
  if (t.hasAttribute('data-flow')) { selectFlow(Number(t.getAttribute('data-flow'))); return; }
  var id = t.getAttribute('data-node');
  if (id && byId.has(id)) { selectNode(id); if (!mobile.matches) centerOn(id); }
});
['L', 'R'].forEach(function (s) {
  var b = $('#tgl' + s);
  b.addEventListener('click', function () {
    var cls = s === 'L' ? 'nol' : 'nor', on = $('main').classList.toggle(cls);
    b.setAttribute('aria-pressed', on ? 'false' : 'true');
  });
});
var themeBtn = $('#theme');
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? 'Light theme' : 'Dark theme';
  safe(function () { localStorage.setItem('codemap-theme', t); });
}
themeBtn.addEventListener('click', function () { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
(function () { var t = safe(function () { return localStorage.getItem('codemap-theme'); }); if (t === 'light') setTheme('light'); })();

// ---- header and footer
(function header() {
  $('#repo').textContent = D.repo || 'code map';
  var when = new Date(D.generated_at), shown = D.generated_at;
  if (!isNaN(when)) shown = when.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'long' });
  var m = '<span>Generated <b title="' + esc(D.generated_at) + '">' + esc(shown) + '</b></span>' +
    '<span>Commit <b class="mono" title="' + esc(D.generated_from_commit) + '">' + esc(D.generated_from_commit.slice(0, 8)) + '</b></span>' +
    '<span class="badge">' + N.length + ' modules</span><span class="badge">' + E.length + ' links</span><span class="badge">' + F.length + ' flows</span>';
  $('#meta').innerHTML = m;
  var unk = E.filter(function (e) { return e.evidence === 'unknown'; }).length;
  var bad = D.words.filter(function (w) { return !w.matches; }).length;
  $('#foot').innerHTML = '<span>Edge crossings <b id="crossings">' + LAY.crossings + '</b> (initial <b id="crossings0">' + LAY.initial + '</b>; layered, long edges routed through slots)</span><span>Layers: <b>' + LAY.layers + '</b></span>' +
    '<span>Unknown links: <b>' + unk + '</b></span><span>Words not matching the code: <b>' + bad + '</b></span><span>Data: codemap.json, same nodes, edges and flows</span>';
})();

// ---- boot
renderDetails(); renderFlowPane(); renderWords(); renderUnknown();
updateGeometry(); applyState(); fit();
new ResizeObserver(function () { if (!userMoved) fit(); }).observe($('#stage'));
if (mobile.addEventListener) mobile.addEventListener('change', function () { document.body.setAttribute('data-sheet', 'none'); setTimeout(function () { if (!userMoved) fit(); }, 0); });
window.__codemap = { select: selectNode, flow: selectFlow, state: S, layout: LAY, layoutFn: layout };
})();
</script>
</body>
</html>
