id: outside-diff-ready-identity
title: READY stays blocked until each outside-diff finding is named
description: Filler bullets must not clear named CodeRabbit outside-diff findings, and one id clears a finding repeated on two reviews.
goal: A handled list passes only when every marker id is named, once, outside an HTML comment.
paths: [scripts/github/review-status.mjs, scripts/github/fixtures/coderabbit-severity/pr193-review-5683574334-outside-three.md]
symbols: [evaluate, outsideDiffOpen, codeRabbitOutsideDiff]
driver: cli
mode: scripted
profile: container
steps:
  - action: {cmd: [node, scripts/trex/bench/flows/S12/outside-diff-ready.mjs]}
    checks:
      - {text: three filler bullets leave the live PR 193 findings unready, stdout: "filler: NOT READY"}
      - {text: the refusal names each of the three marker ids, stdout: "named-missing: b13798430e444855810d559e a808bb67b4cf1eb535da039d 8ca84b7835e8f0beaf1cbae0"}
      - {text: naming each id once clears the same findings repeated on two reviews, stdout: "ids: READY count=3"}
      - {text: a marker id hidden in an HTML comment does not count, stdout: "html-comment: NOT READY"}
      - {text: the identity check exits 0, exit: 0}
limits: {timeoutMs: 60000, retries: 1, maxSteps: 20}
severity: P0
