id: fced1249ce3f4e26
title: Plus-marked Next steps lines clear asks
description: A plus-marked Next steps action must stay an ask instead of an empty list.
goal: parseTurnEnd keeps a plus-marked action as an ask
paths: [.claude/plugins/ccv3-mods/hooks/agentic-os/brief.ts]
driver: cli
mode: scripted
profile: container
steps:
  - action:
      cwd: .
      cmd:
        - node
        - --experimental-strip-types
        - --input-type=module
        - -e
        - |
          import { registerHooks } from 'node:module';
          import { existsSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';
          registerHooks({ resolve(spec, ctx, next) {
            if (/^\.{1,2}\/.*\.js$/.test(spec) && ctx.parentURL?.endsWith('.ts')) {
              const t = new URL(spec.replace(/\.js$/, '.ts'), ctx.parentURL);
              if (existsSync(fileURLToPath(t))) return { url: t.href, shortCircuit: true };
            }
            if (/^\.{1,2}\//.test(spec) && !/\.[cm]?[jt]s$/.test(spec) && ctx.parentURL?.endsWith('.ts')) {
              const t = new URL(spec + '.ts', ctx.parentURL);
              if (existsSync(fileURLToPath(t))) return { url: t.href, shortCircuit: true };
            }
            return next(spec, ctx);
          } });
          const brief = await import('/app/.claude/plugins/ccv3-mods/hooks/agentic-os/brief.ts');
          const answer = ['## Next steps', '+ Nothing for you to do', '+ Paste the build log'].join('\n');
          const ask = brief.parseTurnEnd(answer).ask;
          const texts = Array.isArray(ask) ? ask.map(one => one.text) : Array.of();
          if (!texts.some(text => String(text).includes('Paste the build log'))) {
            console.log('not ok 1 - plus action ask ' + JSON.stringify(ask));
            process.exit(1);
          }
          console.log('ok 1 - a plus-marked action stays an ask');
    checks:
      - {text: the probe exits 0, exit: 0}
      - {text: no failing line, "!stdout": "not ok 1"}
limits: {timeoutMs: 60000, retries: 0, maxSteps: 5}
severity: P1
