id: 044245b09e347dca
title: Rewritten gitdir retargets worktree deletes
description: A nearer .git file aimed at another repo must not allow a delete under that repo's worktrees.
goal: scopedCleanupKind returns null when the gitdir back-pointer is missing
paths: [.claude/hooks/src/shared/scoped-cleanup.ts]
driver: cli
mode: scripted
profile: container
steps:
  - action:
      cwd: .
      cmd:
        - node
        - --experimental-strip-types
        - --input-type=module
        - -e
        - |
          import { registerHooks } from 'node:module';
          import { existsSync, mkdirSync, writeFileSync, rmSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { fileURLToPath } from 'node:url';
          import path from 'node:path';
          registerHooks({ resolve(spec, ctx, next) {
            if (/^\.{1,2}\/.*\.js$/.test(spec) && ctx.parentURL?.endsWith('.ts')) {
              const t = new URL(spec.replace(/\.js$/, '.ts'), ctx.parentURL);
              if (existsSync(fileURLToPath(t))) return { url: t.href, shortCircuit: true };
            }
            return next(spec, ctx);
          }});
          const base = '/tmp/trex-044245b09e347dca';
          rmSync(base, { recursive: true, force: true });
          const victim = path.join(base, 'victim');
          const planted = path.join(base, 'session');
          const cwd = path.join(planted, 'nested');
          mkdirSync(victim, { recursive: true });
          execFileSync('git', ['init', '-q'], { cwd: victim, stdio: 'ignore' });
          const target = path.join(victim, '.claude', 'worktrees', 'legit');
          mkdirSync(target, { recursive: true });
          writeFileSync(path.join(target, 'a.txt'), 'plain');
          mkdirSync(cwd, { recursive: true });
          writeFileSync(path.join(planted, '.git'), `gitdir: ${path.join(victim, '.git')}\n`);
          const { scopedCleanupKind } = await import('/app/.claude/hooks/src/shared/scoped-cleanup.ts');
          const kind = scopedCleanupKind(`rm -rf ${target}`, { tool_name: 'Bash', cwd });
          if (kind !== null) {
            console.log(`not ok 1 - foreign delete classified as ${JSON.stringify(kind)}`);
            process.exit(1);
          }
          console.log('ok 1 - a git file whose back-pointer is missing is refused');
    checks:
      - {text: the probe exits 0, exit: 0}
      - {text: no failing line, "!stdout": "not ok 1"}
limits: {timeoutMs: 60000, retries: 0, maxSteps: 5}
severity: P1
