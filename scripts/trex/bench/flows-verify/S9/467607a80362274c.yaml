id: 467607a80362274c
title: Clean summary carry drops findings in the summary body
description: A clean summary that holds a major finding must not become an empty carry
goal: newestCodeRabbitRound keeps the review object when the summary severity is major
paths: [scripts/github/review-status.mjs]
driver: cli
mode: scripted
profile: container
steps:
  - action:
      cwd: .
      cmd:
        - node
        - --input-type=module
        - -e
        - |
          const { newestCodeRabbitRound, CODERABBIT_LOGIN } = await import('/app/scripts/github/review-status.mjs');
          const sha = (ch) => ch.repeat(40);
          const covered = sha('a');
          const head = sha('b');
          const review = {
            id: 11,
            user: { login: CODERABBIT_LOGIN, type: 'Bot' },
            commit_id: sha('c'),
            submitted_at: '2020-01-01T00:00:00Z',
            body: 'prior round',
          };
          const summary = {
            id: 22,
            user: { login: CODERABBIT_LOGIN, type: 'Bot' },
            created_at: '2024-06-01T00:00:00Z',
            updated_at: '2024-06-01T00:00:00Z',
            body: [
              '<!-- This is an auto-generated comment: summarize by coderabbit.ai -->',
              'No actionable comments were generated',
              `between ${sha('d')} and ${covered}`,
              '</picture> Major',
            ].join('\n'),
          };
          const round = newestCodeRabbitRound({
            reviews: [review],
            comments: [summary],
            commentEdits: { 22: [] },
            head,
          });
          const shown = round ? round.body : null;
          const flag = round ? round.summaryOnly : null;
          if (!(round && round.id === review.id && round.summaryOnly !== true)) {
            console.log(`not ok 1 - clean summary carry stored body ${JSON.stringify(shown)} summaryOnly ${JSON.stringify(flag)}`);
            process.exit(1);
          }
          console.log('ok 1 - a summary with a major finding keeps the review object');
    checks:
      - {text: the probe exits 0, exit: 0}
      - {text: no failing line, "!stdout": "not ok 1"}
limits: {timeoutMs: 60000, retries: 0, maxSteps: 5}
severity: P1
