# CodeRabbit — label-gated PR reviews (DW-91). No secrets in this file.
# https://docs.coderabbit.ai/reference/configuration

language: en
tone_instructions: "Write in ASD-STE100: short active sentences, one idea each. Lead with the defect and file:line. No praise, no summary of what the code does."

reviews:
  auto_review:
    enabled: false
    labels:
      - "review:coderabbit"
      - "review:deep"
      - "review:deep-held"
    # Off: a push does not start a review. READY carries an earlier Minor-only review over a fix of
    # 30 lines or fewer. Otherwise post "@coderabbitai review" once, only when the pr_watch line
    # allows a round. Never post it after a rate-limit notice or while the CodeRabbit status is pending.
    auto_incremental_review: false
    # Backstop only: if the label gate is ever removed, pause after 2 reviewed commits.
    auto_pause_after_reviewed_commits: 2
    drafts: false
    # Anchored: an unanchored "main" also matches branches such as "main-2".
    base_branches:
      - "^main$"
  # Skip list: keep equal to REVIEW.md (scripts/ratchets/review-skip-sync.mjs checks it).
  path_filters:
    - "!**/*.min.js"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!.claude/hooks/dist/**"
    - "!.claude/cache/**"
    - "!docs/reviews/**"
    # Test data. It needs no review, and each reviewed file bills $0.25.
    - "!scripts/github/fixtures/**"
  profile: chill
  auto_approvals:
    enabled: false
  # Adds "extra context used" to each review, so we can see which guideline files load (5-PR window).
  review_details: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  # Walkthrough extras that cost review time and add no CCv3 value.
  sequence_diagrams: false
  related_prs: false
  related_issues: false
  suggested_reviewers: false
  suggested_labels: false
  # Advisory only: no CodeRabbit-authored commits. fix_ci and resolve_merge_conflict default to true
  # on the Team plan and commit to the branch when triggered, so all writing touches are off.
  # The autofix key below is off too (coderabbit-cli.md forbids autopilot mode).
  finishing_touches:
    autofix:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  # Our CI runs Semgrep (ccv3-checks.yml); the Markdown linters are noise on a mostly-Markdown repo.
  # Secret, workflow and shell scanners stay on (gitleaks, trufflehog, actionlint, zizmor,
  # shellcheck, psscriptanalyzer, skillspector, yamllint).
  tools:
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    dotenvLint:
      enabled: false
  # Review CCv3 the way its gates cannot: intent, agreement between two surfaces, fail-open vs
  # fail-closed. Do not re-check what a gate measures (context budget, dist freshness, model drift,
  # skill audit, Semgrep, Trivy). Never list CLAUDE.md here (it is a code guideline already).
  path_instructions:
    - path: ".claude/hooks/src/**/*.ts"
      instructions: |
        Claude Code hook. Check: the settings.json matcher and the runtime tool_name check name the
        same tools, and those tools exist (the subagent tool is "Agent"). A guard fails CLOSED on parse
        doubt. An advisory hook fails OPEN: no stderr, exit 0. Flag the reverse. Flag any new
        hand-written shell lexer. child_process never uses shell: true or a non-literal shell option.
        Detached children use .claude/hooks/src/lib/spawn-hidden.ts. stdout carries only the hook JSON.
        A new hook appears in .claude/settings.json.template in the same PR. Do not comment on dist/ freshness.
    - path: ".claude/hooks/src/__tests__/**"
      instructions: "Tests import the real function. Flag logic copied into a test and tests that restate the code."
    - path: ".claude/{rules-src,rules-ondemand}/**"
      instructions: |
        Rule text loaded into sessions. Use CONTEXT.md terms and active voice. Flag only a sentence
        clearly over 25 words; do not count words or bytes otherwise. No duplicate of another rule.
        A rule that claims enforcement names a registered hook or script. A new on-demand rule updates
        manifest.json and on-demand-rules.md. A behaviour run listed as "after land" in Evidence is accepted.
    - path: ".claude/skills/**"
      instructions: |
        Skill. Under .claude/skills/_vendor/ apply only the _vendor instruction. The description is a
        trigger, not a summary, and it does not take another skill's trigger. No docstring or unit-test ideas.
    - path: ".claude/agents/**"
      instructions: "Agent definition. The .md and .json mirror agree. The tools list covers what the body asks the agent to do. Model tier is checked by a gate; do not comment on it."
    - path: ".claude/skills/_vendor/**"
      instructions: "Third-party content. Report only security issues: secrets, remote code fetch, destructive commands. Ignore style and steering checks."
    - path: "scripts/github/**"
      instructions: |
        READY fails closed: missing data, rate-limit notices, "Review skipped" and "Review failed" never
        count. CodeRabbit CLI output never satisfies READY. Never add a paid-usage or API-key flag to a
        CodeRabbit command. API reads paginate. child_process never uses shell: true or a non-literal
        shell option. An empty or unreadable lock file counts as held until it is stale.
    - path: ".github/workflows/**"
      instructions: "pull_request_target jobs never check out or run PR-head code. Actions pin to a SHA. Secrets are never echoed."
    - path: "**/*.ps1"
      instructions: "PowerShell 7. Single quotes for literal text. No taskkill /T. No bash-only syntax. A file that holds a secret gets a restricted ACL before the secret is written."
    - path: "apps/**/*.sql"
      instructions: |
        Postgres role and privilege script. Review the whole checklist in one pass, not one gap per
        round: effective privileges through has_*_privilege(), PUBLIC grants included; column-level
        grants; sequence USAGE and UPDATE; ownership of the database, schemas, tables and functions;
        role membership and attributes (SUPERUSER, CREATEROLE, BYPASSRLS); default privileges.
        A safety check fails closed when its query returns no row.

knowledge_base:
  mcp:
    usage: disabled
  # CLAUDE.md and AGENTS.md load by default. These add the CCv3 terms and the rules each surface
  # follows. Keep the list short: the guideline budget can drop a source.
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "CONTEXT.md"
        applyTo: "**"
      - files: ".claude/rules-src/hook-dev-lifecycle.md"
        applyTo: ".claude/hooks/**"
      - files: ".claude/rules-src/every-surface-checklist.md"
        applyTo: ".claude/**"
      - files: ".claude/rules-src/agent-model-selection.md"
        applyTo: ".claude/agents/**"
  # A learning from a chat reply waits 3 days before it becomes a review rule.
  learnings:
    scope: local
    approval_delay: 3
  # Default "auto" means global for private repos: Minions history would reach CCv3 reviews.
  pull_requests:
    scope: local
  issues:
    scope: local

chat:
  # Replies only when mentioned.
  auto_reply: false
