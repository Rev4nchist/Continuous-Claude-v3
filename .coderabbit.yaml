# CodeRabbit — label-gated PR reviews (DW-91). No secrets in this file.
# https://docs.coderabbit.ai/reference/configuration

language: en

reviews:
  auto_review:
    enabled: false
    labels:
      - "review:coderabbit"
      - "review:deep"
    # Off: a push does not start a review, so after a push on a labelled PR post "@coderabbitai review"
    # once. review-status.mjs says so in its reason. Do not post it after a rate-limit notice.
    auto_incremental_review: false
    drafts: false
    base_branches:
      - main
  # Skip list: keep equal to REVIEW.md (scripts/ratchets/review-skip-sync.mjs checks it).
  path_filters:
    - "!**/*.min.js"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!.claude/hooks/dist/**"
    - "!.claude/cache/**"
    - "!docs/reviews/**"
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  # Advisory only: no CodeRabbit-authored commits. Key verified in docs.coderabbit.ai/reference/configuration
  # (Fix comments finishing touch). The ongoing "Autofix"/autopilot mode has no documented YAML key.
  finishing_touches:
    autofix:
      enabled: false

knowledge_base:
  mcp:
    usage: disabled
