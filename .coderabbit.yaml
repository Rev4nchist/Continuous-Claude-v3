# CodeRabbit — label-gated PR reviews (DW-91). No secrets in this file.
# https://docs.coderabbit.ai/reference/configuration

language: en

reviews:
  auto_review:
    enabled: false
    labels:
      - "review:coderabbit"
      - "review:deep"
      - "review:deep-held"
    # Off: a push does not start a review, so after a push on a labelled PR post "@coderabbitai review"
    # once. review-status.mjs says so in its reason. Do not post it after a rate-limit notice.
    auto_incremental_review: false
    # Backstop only: if the label gate is ever removed, pause after 2 reviewed commits.
    auto_pause_after_reviewed_commits: 2
    drafts: false
    # Anchored: an unanchored "main" also matches branches such as "main-2".
    base_branches:
      - "^main$"
  # Skip list: keep equal to REVIEW.md (scripts/ratchets/review-skip-sync.mjs checks it).
  path_filters:
    - "!**/*.min.js"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!.claude/hooks/dist/**"
    - "!.claude/cache/**"
    - "!docs/reviews/**"
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  # Walkthrough extras that cost review time and add no CCv3 value.
  sequence_diagrams: false
  related_prs: false
  related_issues: false
  suggested_reviewers: false
  suggested_labels: false
  # Advisory only: no CodeRabbit-authored commits. fix_ci and resolve_merge_conflict default to true
  # on the Team plan and commit to the branch when triggered, so all writing touches are off.
  # The ongoing "Autofix"/autopilot mode has no documented YAML key (coderabbit-cli.md forbids it).
  finishing_touches:
    autofix:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  # Our CI runs Semgrep (ccv3-checks.yml); the Markdown linters are noise on a mostly-Markdown repo.
  # Secret, workflow and shell scanners stay on (gitleaks, trufflehog, actionlint, zizmor,
  # shellcheck, psscriptanalyzer, skillspector, yamllint).
  tools:
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    dotenvLint:
      enabled: false

knowledge_base:
  mcp:
    usage: disabled
