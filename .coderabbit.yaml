# CodeRabbit — label-gated PR reviews (DW-91). No secrets in this file.
# https://docs.coderabbit.ai/reference/configuration

language: en

reviews:
  auto_review:
    enabled: false
    labels:
      - "review:coderabbit"
      - "review:deep"
    auto_incremental_review: false
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/*.min.js"
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/.claude/hooks/dist/**"
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

knowledge_base:
  mcp:
    usage: disabled
